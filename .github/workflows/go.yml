# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    tags: 
      - '**'
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27.2'

    - name: Install bats
      run: |
        sudo apt-get update
        sudo apt-get install -y bats

    - name: Run shell tests
      run: bats tests/install.bats tests/mysqlconfigurer.bats tests/release.bats tests/docker.bats tests/docker_entrypoint.bats

    # Offline Windows configurer checks; ubuntu-latest ships PowerShell 7.
    - name: Run offline PowerShell tests
      shell: pwsh
      run: |
        foreach ($test in 'tests/windows/test_configurer.ps1', 'tests/windows/test_apply_prepared_unit.ps1') {
          pwsh -NoProfile -File $test
          if ($LASTEXITCODE -ne 0) { throw "$test failed with exit code $LASTEXITCODE" }
        }

    - name: Build
      run: bash build.sh
      
    - name: Create upload dir
      run: |
        mkdir -p ../v2
        cp current_version_agent install.sh releem.sh mysqlconfigurer.sh windows/install.ps1 windows/releem.ps1 windows/mysqlconfigurer.ps1 releem-agent-x86_64 releem-agent-amd64 releem-agent-aarch64 releem-agent-freebsd-amd64 releem-agent-i686 releem-agent.exe ../v2/

    # shallwefootball/upload-s3-action has no Node 24 release, so upload with
    # the runner's AWS CLI. Keep its public-read ACL and content types; unlike
    # the action, a failed upload now fails the job.
    - name: Upload S3 current_version_agent
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-1
        AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
      run: |
        for file in ../v2/*; do
          case "$file" in
            *.sh) content_type=application/x-sh ;;
            *.exe) content_type=application/x-msdownload ;;
            *) content_type=text/plain ;;
          esac
          aws s3 cp "$file" "s3://${AWS_BUCKET}/v2/$(basename "$file")" \
            --acl public-read --content-type "$content_type"
        done
          
    - name: Log in to Docker Hub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        platforms: linux/amd64,linux/386, linux/arm64

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: releem/releem-agent            
      
    - name: Build and push Docker images
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        platforms: linux/amd64,linux/386, linux/arm64
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}        
